<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitech Advisors · Lead Gen Engine</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #fff; --ink: #17181c; --muted: #6b7280;
    --line: #e6e7eb; --accent: #e6383e; --accent-ink: #fff; --navy: #101332; --logo-bg: transparent;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0e20; --card: #14172e; --ink: #e9eaef; --muted: #9aa0b4;
      --line: #262a45; --accent: #e6383e; --accent-ink: #fff;
      --navy: #101332; --logo-bg: #fff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header.brand {
    display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
  }
  header.brand img {
    height: 44px; background: var(--logo-bg);
    border-radius: 6px; padding: 4px 6px;
  }
  .brand .divider { width: 1px; height: 36px; background: var(--line); }
  h1 { font-size: 19px; margin: 0; letter-spacing: .01em; }
  h1 .demo {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 4px; padding: 2px 6px; vertical-align: 2px; margin-left: 6px;
  }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  form {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 18px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.grow { flex: 1 1 340px; }
  label { font-size: 12px; font-weight: 600; color: var(--muted); }
  input, select {
    font: inherit; padding: 9px 11px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  select { cursor: pointer; }
  input:disabled { opacity: .45; cursor: not-allowed; }
  button {
    font: inherit; font-weight: 600; padding: 9px 18px; border: 0;
    border-radius: 7px; background: var(--accent); color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .status { font-size: 13px; color: var(--muted); margin-bottom: 12px; min-height: 20px; }
  .status.err { color: #dc2626; }
  .tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px;
    table-layout: fixed; min-width: 960px; }
  col.c-name { width: 12%; } col.c-domain { width: 12.5%; }
  col.c-rev { width: 6%; } col.c-state { width: 4.5%; }
  col.c-cat { width: 10%; } col.c-addr { width: 14%; }
  col.c-lead { width: 27%; } col.c-acq { width: 14%; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line);
    vertical-align: top; overflow-wrap: anywhere; }
  td > a {
    display: inline-block; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom;
  }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.name { font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.addr { color: var(--muted); font-size: 13px; }
  td.lead { font-size: 14px; }
  button.mini {
    padding: 4px 12px; font-size: 12px; font-weight: 600;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 6px;
  }
  button.mini:disabled { opacity: .55; }
  .lead .person { display: flex; flex-direction: column; gap: 4px; padding: 2px 0; }
  .lead .person + .person { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px; }
  .lead .pname { font-weight: 600; font-size: 15px; }
  .lead .actions { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .val {
    display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 11px; font-size: 13.5px;
  }
  .val a {
    color: var(--ink); text-decoration: none; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    display: inline-block; min-width: 0;
  }
  .val a:hover { color: var(--accent); }
  .lead .title { color: var(--muted); }
  .lead .src { display: block; font-size: 11px; color: var(--muted); margin: 0 0 4px; }
  .lead .email-slot { display: inline-flex; }
  .lead button.email { padding: 4px 11px; font-size: 12.5px; }
  .lead .li-slot { display: inline-flex; }
  .lead button.li { padding: 4px 11px; font-size: 12.5px; font-style: normal; }
  .lead .mob-slot { display: inline-flex; }
  .lead button.mob { padding: 4px 11px; font-size: 12.5px; }
  .lead a.found { font-weight: 600; }
  button.copy {
    padding: 1px 7px; margin-left: 5px; font-size: 13px; line-height: 1.6;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 5px; vertical-align: 1px;
  }
  button.copy:hover { color: var(--accent); border-color: var(--accent); }
  button.copy.done { color: #16a34a; border-color: #16a34a; }
  td.acq { font-size: 13.5px; }
  .acq .acquired { color: var(--accent); font-weight: 700; display: block; }
  .acq .acq-by { display: block; }
  .acq .independent { color: #16a34a; font-weight: 600; display: block; }
  .acq .unconfirmed { color: #d97706; font-weight: 700; display: block; }
  .acq .src { display: block; font-size: 11px; color: var(--muted); }
  .acq .src a { color: var(--muted); }
  .lead .src a { color: var(--muted); }
  .lead .none { color: var(--muted); font-style: italic; }
  .lead .err { color: #dc2626; cursor: pointer; text-decoration: underline dotted; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  td > a { color: var(--ink); border-bottom: 1px solid var(--line); }
  td > a:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
  tbody tr:hover td { background: rgba(128, 138, 170, .05); }
  .dash { color: var(--muted); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <img src="{{ url_for('static', filename='hitech-logo.png') }}" alt="Hitech Advisors">
    <div class="divider"></div>
    <div>
      <h1>Lead Gen Engine <span class="demo">Demo</span></h1>
      <p class="sub">Find local businesses and the people behind them</p>
    </div>
  </header>

  <form id="f">
    <div class="field grow">
      <label for="q">Search query</label>
      <input id="q" value="Windows and doors contractor" placeholder="e.g. Windows and doors contractor" autocomplete="off" required>
    </div>
    <div class="field">
      <label for="st">State</label>
      <select id="st" style="width:170px">
        <option>Alabama</option>
        <option>Alaska</option>
        <option>Arizona</option>
        <option>Arkansas</option>
        <option>California</option>
        <option>Colorado</option>
        <option>Connecticut</option>
        <option>Delaware</option>
        <option selected>Florida</option>
        <option>Georgia</option>
        <option>Hawaii</option>
        <option>Idaho</option>
        <option>Illinois</option>
        <option>Indiana</option>
        <option>Iowa</option>
        <option>Kansas</option>
        <option>Kentucky</option>
        <option>Louisiana</option>
        <option>Maine</option>
        <option>Maryland</option>
        <option>Massachusetts</option>
        <option>Michigan</option>
        <option>Minnesota</option>
        <option>Mississippi</option>
        <option>Missouri</option>
        <option>Montana</option>
        <option>Nebraska</option>
        <option>Nevada</option>
        <option>New Hampshire</option>
        <option>New Jersey</option>
        <option>New Mexico</option>
        <option>New York</option>
        <option>North Carolina</option>
        <option>North Dakota</option>
        <option>Ohio</option>
        <option>Oklahoma</option>
        <option>Oregon</option>
        <option>Pennsylvania</option>
        <option>Rhode Island</option>
        <option>South Carolina</option>
        <option>South Dakota</option>
        <option>Tennessee</option>
        <option>Texas</option>
        <option>Utah</option>
        <option>Vermont</option>
        <option>Virginia</option>
        <option>Washington</option>
        <option>West Virginia</option>
        <option>Wisconsin</option>
        <option>Wyoming</option>
      </select>
    </div>
    <div class="field">
      <label for="n">Results</label>
      <input id="n" type="number" value="{{ page_size }}" style="width:90px" disabled title="Fixed at {{ page_size }} for now">
    </div>
    <button id="go" type="submit">Search</button>
  </form>

  <div class="bar">
    <div class="status" id="status"></div>
    <button class="ghost" id="csv" type="button" hidden>Download CSV</button>
  </div>
  <div class="tablewrap" id="tablewrap" hidden>
    <table>
      <colgroup>
        <col class="c-name"><col class="c-domain"><col class="c-rev"><col class="c-state">
        <col class="c-cat"><col class="c-addr"><col class="c-lead"><col class="c-acq">
      </colgroup>
      <thead><tr>
        <th>Name</th><th>Domain</th>
        <th style="text-align:right">Reviews</th><th>State</th><th>Category</th><th>Address</th><th>Leadership</th><th>Acquired?</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let current = [];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const copyBtn = v => `<button class="copy" data-copy="${esc(v)}" title="Copy">⧉</button>`;
const cell = v => (v === null || v === undefined || v === '')
  ? '<span class="dash">—</span>' : esc(v);

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const query = $('q').value.trim();
  const state = $('st').value.trim();
  if (!query) return;
  $('go').disabled = true;
  $('status').className = 'status';
  $('status').textContent = 'Searching…';
  $('csv').hidden = true;

  try {
    const res = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, state, limit: Number($('n').value) || 20})
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(`Server error ${res.status}: ${text.slice(0, 80)}`); }
    if (!res.ok) throw new Error(data.error || 'Search failed');

    current = data.results;
    $('rows').innerHTML = current.map((r, i) => `<tr>
      <td class="name">${cell(r.name)}</td>
      <td>${r.domain ? `<a href="https://${esc(r.domain)}" target="_blank" rel="noopener">${esc(r.domain)}</a>` : '<span class="dash">—</span>'}</td>
      <td class="num">${r.ratingCount != null ? r.ratingCount.toLocaleString() : '<span class="dash">—</span>'}</td>
      <td>${cell(r.state)}</td>
      <td>${cell(r.category)}</td>
      <td class="addr">${cell(r.address)}</td>
      <td class="lead" data-i="${i}"><button class="mini check" data-i="${i}">Check</button></td>
      <td class="acq"><button class="mini acq-check" data-i="${i}">Check</button></td>
    </tr>`).join('');

    $('tablewrap').hidden = current.length === 0;
    $('csv').hidden = current.length === 0;
    const note = data.filtered
      ? ` · ${data.filtered} filtered out`
      : '';
    $('status').textContent = current.length
      ? `${current.length} result${current.length === 1 ? '' : 's'} for “${data.query}”${note}`
      : `No results for “${data.query}”${note}.`;
    $('status').title = data.filtered
      ? 'Excluded (directories & manufacturers):\n' + data.filteredDomains.join('\n')
      : '';
  } catch (err) {
    $('status').className = 'status err';
    $('status').textContent = err.message;
    $('tablewrap').hidden = true;
  } finally {
    $('go').disabled = false;
  }
});

async function checkRow(i, cellEl) {
  const r = current[i];
  cellEl.innerHTML = '<span class="dash">Searching…</span>';
  try {
    const res = await fetch('/api/leadership', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: r.name, domain: r.domain,
                            website: r.website, address: r.address,
                            phone: r.phone, category: r.category})
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(`Server error ${res.status}: ${text.slice(0, 80)}`); }
    if (!res.ok) throw new Error(data.error || 'Lookup failed');
    r.leadership = data.people
      .map(p => `${p.name} (${p.title})` + (p.source ? ` [${p.source}]` : ''))
      .join('; ');
    const srcHtml = p => {
      if (!p.source) return '';
      const t = /^https?:\/\//.test(p.source)
        ? `<a href="${esc(p.source)}" target="_blank" rel="noopener">${esc(p.source.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])}</a>`
        : esc(p.source);
      return `<span class="src">${t}</span>`;
    };
    cellEl.innerHTML = data.people.length
      ? data.people.map((p, j) =>
          `<div class="person">
           <span class="pname">${esc(p.name)}<span class="title"> · ${esc(p.title)}</span></span>
           <span class="actions">
             <span class="email-slot">${r.domain ? `<button class="mini email" data-i="${i}" data-j="${j}">✉ Email</button>` : ''}</span>
             <span class="li-slot"><button class="mini li" data-i="${i}" data-j="${j}">in LinkedIn</button></span>
           </span>
           ${srcHtml(p)}</div>`
        ).join('')
      : '<span class="none">no one found</span>';
    r._people = data.people;
    if (data.source) cellEl.title = data.source;
  } catch (err) {
    cellEl.innerHTML = `<span class="err" title="Click to retry">${esc(err.message)}</span>`;
    cellEl.querySelector('.err').onclick = () => checkRow(i, cellEl);
  }
}

$('rows').addEventListener('click', e => {
  const cp = e.target.closest('button.copy');
  if (cp) {
    const ok = () => {
      cp.textContent = '✓';
      cp.classList.add('done');
      setTimeout(() => { cp.textContent = '⧉'; cp.classList.remove('done'); }, 1200);
    };
    navigator.clipboard.writeText(cp.dataset.copy).then(ok).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = cp.dataset.copy;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      ok();
    });
    return;
  }
  const check = e.target.closest('button.check');
  if (check) {
    check.disabled = true;
    checkRow(Number(check.dataset.i), check.closest('td'));
    return;
  }
  const em = e.target.closest('button.email');
  if (em) {
    em.disabled = true;
    findEmail(Number(em.dataset.i), Number(em.dataset.j), em);
    return;
  }
  const li = e.target.closest('button.li');
  if (li) {
    li.disabled = true;
    findLinkedIn(Number(li.dataset.i), Number(li.dataset.j), li);
    return;
  }
  const mob = e.target.closest('button.mob');
  if (mob) {
    mob.disabled = true;
    findMobile(Number(mob.dataset.i), Number(mob.dataset.j), mob);
    return;
  }
  const acq = e.target.closest('button.acq-check');
  if (acq) {
    acq.disabled = true;
    checkAcquisition(Number(acq.dataset.i), acq.closest('td'));
  }
});

async function checkAcquisition(i, cellEl) {
  const r = current[i];
  cellEl.innerHTML = '<span class="dash">Searching…</span>';
  try {
    const res = await fetch('/api/acquisition', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: r.name, domain: r.domain,
                            website: r.website, address: r.address,
                            phone: r.phone, category: r.category})
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(`Server error ${res.status}: ${text.slice(0, 80)}`); }
    if (!res.ok) throw new Error(data.error || 'Acquisition check failed');

    const srcLink = data.source_url
      ? `<span class="src"><a href="${esc(data.source_url)}" target="_blank" rel="noopener"
           title="${esc(data.source_url)}">source: ${esc(data.source_url.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])} ↗</a>${copyBtn(data.source_url)}</span>`
      : '';
    if (data.status === 'acquired') {
      r.acquired = `Acquired by ${data.acquirer}` + (data.when ? ` (${data.when})` : '') + (data.source_url ? ` — ${data.source_url}` : '');
      cellEl.innerHTML = `<span class="acquired">● Acquired</span>
        <span class="acq-by">${esc(data.acquirer)}${data.when ? ' · ' + esc(data.when) : ''}</span>${srcLink}`;
      cellEl.title = [data.quote, data.detail, data.verification].filter(Boolean).join('\n');
    } else if (data.status === 'unconfirmed') {
      r.acquired = `Unconfirmed claim (${data.acquirer || 'unknown buyer'})` + (data.source_url ? ` — ${data.source_url}` : '');
      cellEl.innerHTML = `<span class="unconfirmed">● Unconfirmed</span>
        <span class="acq-by">claim: ${esc(data.acquirer || '?')} — needs manual review</span>${srcLink}`;
      cellEl.title = data.verification || '';
    } else {
      r.acquired = 'Independent';
      cellEl.innerHTML = `<span class="independent">● Independent</span>`;
      cellEl.title = data.verification || data.source || '';
    }
  } catch (err) {
    cellEl.innerHTML = `<span class="err" title="Click to retry">${esc(err.message)}</span>`;
    cellEl.querySelector('.err').onclick = () => checkAcquisition(i, cellEl);
  }
}

async function findEmail(i, j, btn) {
  const r = current[i];
  const person = r._people[j];
  const slot = btn.closest('.email-slot');
  slot.innerHTML = '<span class="dash">Searching…</span>';
  try {
    const res = await fetch('/api/email', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({person: person.name, domain: r.domain})
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(`Server error ${res.status}: ${text.slice(0, 80)}`); }
    if (!res.ok) throw new Error(data.error || 'Email lookup failed');
    if (data.email) {
      person.email = data.email;
      r.leadership = r._people
        .map(p => `${p.name} (${p.title})` + (p.email ? ` <${p.email}>` : '') + (p.source ? ` [${p.source}]` : ''))
        .join('; ');
      slot.innerHTML = `<span class="val"><a href="mailto:${esc(data.email)}" title="${esc(data.email)}">✉ ${esc(data.email)}</a>${copyBtn(data.email)}</span>`;
    } else {
      slot.innerHTML = '<span class="none">no email found</span>';
    }
  } catch (err) {
    slot.innerHTML = `<span class="err" title="Click to retry">${esc(err.message)}</span>`;
    slot.querySelector('.err').onclick = () => {
      slot.innerHTML = '';
      findEmail(i, j, btn);
    };
  }
}

async function findLinkedIn(i, j, btn) {
  const r = current[i];
  const person = r._people[j];
  const slot = btn.closest('.li-slot');
  slot.innerHTML = '<span class="dash">Searching…</span>';
  try {
    const res = await fetch('/api/linkedin', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({person: person.name, title: person.title,
                            company: r.name, domain: r.domain,
                            address: r.address})
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(`Server error ${res.status}: ${text.slice(0, 80)}`); }
    if (!res.ok) throw new Error(data.error || 'LinkedIn lookup failed');
    if (data.url) {
      person.linkedin = data.url;
      r.leadership = r._people
        .map(p => `${p.name} (${p.title})`
          + (p.email ? ` <${p.email}>` : '')
          + (p.linkedin ? ` ${p.linkedin}` : '')
          + (p.source ? ` [${p.source}]` : ''))
        .join('; ');
      slot.innerHTML = `<span class="val"><a href="${esc(data.url)}" target="_blank" rel="noopener"
        title="${esc(data.evidence)}">in Profile ↗</a>${copyBtn(data.url)}</span>${
        data.confidence === 'medium' ? ' <span class="none">(unverified)</span>' : ''}
        <span class="mob-slot"><button class="mini mob" data-i="${i}" data-j="${j}">📱 Mobile</button></span>`;
    } else {
      slot.innerHTML = '<span class="none" title="' + esc(data.evidence || '') + '">no confident match</span>';
    }
  } catch (err) {
    slot.innerHTML = `<span class="err" title="Click to retry">${esc(err.message)}</span>`;
    slot.querySelector('.err').onclick = () => {
      slot.innerHTML = '';
      findLinkedIn(i, j, btn);
    };
  }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function findMobile(i, j, btn) {
  const r = current[i];
  const person = r._people[j];
  const slot = btn.closest('.mob-slot');
  slot.innerHTML = '<span class="dash">Sent to enrichment…</span>';
  try {
    const res = await fetch('/api/mobile', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({person: person.name, title: person.title,
                            linkedin: person.linkedin, company: r.name,
                            domain: r.domain})
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(`Server error ${res.status}: ${text.slice(0, 80)}`); }
    if (!res.ok) throw new Error(data.error || 'Mobile lookup failed');

    // Clay needs a moment: first poll after 10s, then every 5s, ~2 min cap
    await sleep(10000);
    for (let attempt = 0; attempt < 23; attempt++) {
      const pr = await fetch('/api/mobile/' + data.request_id);
      const pd = await pr.json();
      if (pd.status === 'found' && pd.mobile) {
        person.mobile = pd.mobile;
        r.leadership = r._people
          .map(p => `${p.name} (${p.title})`
            + (p.email ? ` <${p.email}>` : '')
            + (p.mobile ? ` ${p.mobile}` : '')
            + (p.linkedin ? ` ${p.linkedin}` : '')
            + (p.source ? ` [${p.source}]` : ''))
          .join('; ');
        slot.innerHTML = `<span class="val"><a href="tel:${esc(pd.mobile)}">📱 ${esc(pd.mobile)}</a>${copyBtn(pd.mobile)}</span>`;
        return;
      }
      if (pd.status === 'not_found') {
        slot.innerHTML = '<span class="none">no mobile found</span>';
        return;
      }
      slot.innerHTML = `<span class="dash">Waiting for result… ${10 + attempt * 5}s</span>`;
      await sleep(5000);
    }
    throw new Error('Timed out waiting for result');
  } catch (err) {
    slot.innerHTML = `<span class="err" title="Click to retry">${esc(err.message)}</span>`;
    slot.querySelector('.err').onclick = () => {
      slot.innerHTML = '';
      findMobile(i, j, btn);
    };
  }
}

$('csv').addEventListener('click', async () => {
  const res = await fetch('/api/export', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({results: current})
  });
  const url = URL.createObjectURL(await res.blob());
  const a = document.createElement('a');
  a.href = url; a.download = 'maps_results.csv'; a.click();
  URL.revokeObjectURL(url);
});
</script>
